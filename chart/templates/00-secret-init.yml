{{/*
  One-time "secret initialization" Job.

  Several Malcolm service passwords (valkey, the embedded NetBox instance, and the
  Arkime password hash secret) used to be generated inline with Helm's `randAlphaNum`.
  Because `randAlphaNum` produces a *different* value on every `helm template`, GitOps
  tools such as Argo CD (which render the chart on every reconcile, without live cluster
  access for `lookup`) saw the Secret data change on every comparison and reported the
  Application as perpetually `OutOfSync`.

  Instead of templating these passwords, this hook Job generates them with a CSPRNG
  *once* and persists them into Secrets that the Job itself owns. Those Secrets are
  therefore never part of the rendered chart, so Argo CD has nothing to diff against and
  the value stays stable across reconciles. On every subsequent run the Job *preserves*
  any password already present in the cluster, so existing data (valkey AUTH, NetBox
  SECRET_KEY/sessions, the Arkime cluster password hash) is never disrupted; only the
  deterministic, non-secret fields are refreshed from values.yaml.

  It runs as a `pre-install`/`pre-upgrade` hook so the Secrets exist before the workloads
  that consume them (Argo CD maps these to PreSync hooks automatically).
*/}}
{{- $saName := "malcolm-secret-init" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  # Read existing secrets (to preserve already-generated passwords) and
  # create/update the Job-owned password secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      name: {{ $saName }}
    spec:
      serviceAccountName: {{ $saName }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: secret-init
          image: "{{ .Values.secret_init.image }}"
          imagePullPolicy: "{{ .Values.secret_init.pullPolicy | default .Values.image.pullPolicy }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # kubectl needs a writable HOME for its discovery cache; the root
            # filesystem is read-only, so give it a scratch emptyDir.
            - name: tmp
              mountPath: /tmp
          env:
            - name: HOME
              value: /tmp
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # ---- deterministic (non-secret) configuration, sourced from values.yaml ----
            - name: VALKEY_PORT_LOCAL
              value: "{{ .Values.valkey_env.ports.local.persistent }}"
            - name: VALKEY_CACHE_PORT_LOCAL
              value: "{{ .Values.valkey_env.ports.local.cache }}"
            - name: VALKEY_PORT_REMOTE
              value: "{{ .Values.valkey_env.ports.remote.persistent }}"
            - name: VALKEY_CACHE_PORT_REMOTE
              value: "{{ .Values.valkey_env.ports.remote.cache }}"
            - name: NETBOX_TOKEN
              value: "{{ if eq .Values.netbox.mode "remote" }}{{ .Values.netbox.netbox_remote_token }}{{ end }}"
            # MaxMind GeoIP database update account ID and API key
            - name: MAXMIND_ACCOUNT_ID
              value: "{{ .Values.maxmind.account_id }}"
            - name: MAXMIND_LICENSE_KEY
              value: "{{ .Values.maxmind.license_key }}"
            # Alternate download URL for MaxMind MMDB tarballs
            - name: MAXMIND_ALT_URL
              value: "{{ .Values.maxmind.alternate_url }}"
            # If the Arkime WISE plugin is in use, this sets the configuration PIN for the WISE GUI
            - name: ARKIME_WISE_PIN
              value: "{{ .Values.auth.arkime_wise_pin }}"
            # Internal password hash secret for Arkime viewer cluster (see https://arkime.com/settings#passwordSecret)
            - name: ARKIME_PASSWORD_OVERRIDE
              value: "{{ .Values.auth.arkime_password }}"
            - name: POSTGRES_HOST
              value: "{{ .Values.postgres.host }}"
            - name: POSTGRES_NETBOX_DB
              value: "{{ .Values.postgres.netbox_db_name }}"
            - name: POSTGRES_KEYCLOAK_DB
              value: "{{ .Values.postgres.keycloak_db_name }}"
            - name: POSTGRES_DISABLED
              value: "{{ not .Values.postgres.enabled }}"
            - name: POSTGRES_PASSWORD_OVERRIDE
              value: "{{ .Values.postgres.password }}"
            # Specifies the password for encrypted Zeek-extracted files served over HTTP
            #   If FILESCAN_HTTP_SERVER_ZIP is true this is the password for the Zip file,
            #   otherwise it is the AES-256-CBC decryption password
            - name: FILESCAN_HTTP_SERVER_KEY_OVERRIDE
              value: "{{ .Values.filescan_env.extracted_file_http_server_encrypt_password }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              # Generate an alphanumeric secret of the requested length from the kernel
              # CSPRNG (matches the old `randAlphaNum N` charset/length). No `pipefail`,
              # so `head` closing the pipe early does not abort the script under `set -e`.
              gen() {
                LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c "$1"
              }

              # Read an existing key from a live secret; empty string if absent.
              existing() {
                kubectl -n "$NAMESPACE" get secret "$1" -o "jsonpath={.data.$2}" 2>/dev/null \
                  | base64 -d 2>/dev/null || true
              }

              # Build/refresh a secret: deterministic config is taken from the arguments,
              # already-persisted passwords are preserved. `apply` keeps config in sync
              # without ever changing a preserved password.
              apply_secret() {
                name="$1"; shift
                kubectl create secret generic "$name" --dry-run=client -o yaml "$@" \
                  | kubectl -n "$NAMESPACE" apply -f -
              }

              # ---- resolve passwords: prefer an already-persisted value, else generate ----
              # The valkey AUTH password is shared by the valkey servers and every client
              # (incl. the embedded NetBox), so it must be identical in both secrets.
              VALKEY_PW="$(existing valkey-env VALKEY_PASSWORD)"
              [ -n "$VALKEY_PW" ] || VALKEY_PW="$(existing netbox-secret-env VALKEY_PASSWORD)"
              [ -n "$VALKEY_PW" ] || VALKEY_PW="$(gen 25)"

              VALKEY_RS_PW="$(existing valkey-remotesensor-env VALKEY_PASSWORD)"
              [ -n "$VALKEY_RS_PW" ] || VALKEY_RS_PW="$(gen 25)"

              NETBOX_SECRET_KEY="$(existing netbox-secret-env SECRET_KEY)"
              [ -n "$NETBOX_SECRET_KEY" ] || NETBOX_SECRET_KEY="$(gen 50)"

              NETBOX_API_TOKEN="$(existing netbox-secret-env SUPERUSER_API_TOKEN)"
              [ -n "$NETBOX_API_TOKEN" ] || NETBOX_API_TOKEN="$(gen 32)"

              NETBOX_SUPERUSER_PW="$(existing netbox-secret-env SUPERUSER_PASSWORD)"
              [ -n "$NETBOX_SUPERUSER_PW" ] || NETBOX_SUPERUSER_PW="$(gen 25)"

              # Filescan: explicit override wins, then persisted value, then generate.
              if [ -n "${FILESCAN_HTTP_SERVER_KEY_OVERRIDE:-}" ]; then
                FILESCAN_KEY="$FILESCAN_HTTP_SERVER_KEY_OVERRIDE"
              else
                FILESCAN_KEY="$(existing filescan-secret-env FILESCAN_HTTP_SERVER_KEY)"
                [ -n "$FILESCAN_KEY" ] || FILESCAN_KEY="$(gen 14)"
              fi

              # Postgres: explicit override wins, then persisted value, then generate.
              if [ -n "${POSTGRES_PASSWORD_OVERRIDE:-}" ]; then
                POSTGRES_PW="$POSTGRES_PASSWORD_OVERRIDE"
              else
                POSTGRES_PW="$(existing postgres-env POSTGRES_PASSWORD)"
                [ -n "$POSTGRES_PW" ] || POSTGRES_PW="$(gen 32)"
              fi

              # Arkime: explicit override wins, then persisted value, then generate.
              if [ -n "${ARKIME_PASSWORD_OVERRIDE:-}" ]; then
                ARKIME_PW="$ARKIME_PASSWORD_OVERRIDE"
              else
                ARKIME_PW="$(existing arkime-secret-env ARKIME_PASSWORD_SECRET)"
                [ -n "$ARKIME_PW" ] || ARKIME_PW="$(gen 32)"
              fi

              echo "Reconciling Malcolm-generated secrets in namespace ${NAMESPACE}..."

              apply_secret valkey-env \
                --from-literal=VALKEY_PASSWORD="$VALKEY_PW" \
                --from-literal=VALKEY_HOST=valkey \
                --from-literal=VALKEY_PORT="$VALKEY_PORT_LOCAL" \
                --from-literal=VALKEY_CACHE_HOST=valkey-cache \
                --from-literal=VALKEY_CACHE_PORT="$VALKEY_CACHE_PORT_LOCAL" \
                --from-literal=VALKEY_NETBOX_DATABASE=0 \
                --from-literal=VALKEY_ZEEK_FILES_DATABASE=1 \
                --from-literal=VALKEY_NETBOX_CACHE_DATABASE=0 \
                --from-literal=VALKEY_STRELKA_COORDINATOR_CACHE_DATABASE=1 \
                --from-literal=VALKEY_STRELKA_GATEKEEPER_CACHE_DATABASE=2 \
                --from-literal=VALKEY_FILESCAN_CACHE_DATABASE=3

              apply_secret valkey-remotesensor-env \
                --from-literal=VALKEY_PASSWORD="$VALKEY_RS_PW" \
                --from-literal=VALKEY_HOST=localhost \
                --from-literal=VALKEY_PORT="$VALKEY_PORT_REMOTE" \
                --from-literal=VALKEY_CACHE_HOST=localhost \
                --from-literal=VALKEY_CACHE_PORT="$VALKEY_CACHE_PORT_REMOTE" \
                --from-literal=VALKEY_ZEEK_FILES_DATABASE=1 \
                --from-literal=VALKEY_STRELKA_COORDINATOR_CACHE_DATABASE=1 \
                --from-literal=VALKEY_STRELKA_GATEKEEPER_CACHE_DATABASE=2 \
                --from-literal=VALKEY_FILESCAN_CACHE_DATABASE=3

              apply_secret netbox-secret-env \
                --from-literal=DB_USER=netbox \
                --from-literal=EMAIL_PASSWORD= \
                --from-literal=EMAIL_USERNAME=netbox \
                --from-literal=NAPALM_PASSWORD= \
                --from-literal=NAPALM_USERNAME= \
                --from-literal=VALKEY_CACHE_PASSWORD="$VALKEY_PW" \
                --from-literal=VALKEY_PASSWORD="$VALKEY_PW" \
                --from-literal=SECRET_KEY="$NETBOX_SECRET_KEY" \
                --from-literal=SUPERUSER_API_TOKEN="$NETBOX_API_TOKEN" \
                --from-literal=SUPERUSER_NAME=admin \
                --from-literal=SUPERUSER_PASSWORD="$NETBOX_SUPERUSER_PW" \
                --from-literal=NETBOX_TOKEN="${NETBOX_TOKEN:-}"

              apply_secret postgres-env \
                --from-literal=DB_HOST="${POSTGRES_HOST:-}" \
                --from-literal=POSTGRES_HOST="${POSTGRES_HOST:-}" \
                --from-literal=PGPORT=5432 \
                --from-literal=POSTGRES_DB=postgres \
                --from-literal=POSTGRES_USER=postgres \
                --from-literal=POSTGRES_PASSWORD="$POSTGRES_PW" \
                --from-literal=POSTGRES_NETBOX_DB="${POSTGRES_NETBOX_DB:-}" \
                --from-literal=POSTGRES_NETBOX_USER=netbox \
                --from-literal=POSTGRES_NETBOX_PASSWORD="$POSTGRES_PW" \
                --from-literal=POSTGRES_KEYCLOAK_DB="${POSTGRES_KEYCLOAK_DB:-}" \
                --from-literal=POSTGRES_KEYCLOAK_USER=keycloak \
                --from-literal=POSTGRES_KEYCLOAK_PASSWORD="$POSTGRES_PW" \
                --from-literal=POSTGRES_DISABLED="${POSTGRES_DISABLED:-}"

              apply_secret filescan-secret-env \
                --from-literal=FILESCAN_HTTP_SERVER_KEY="$FILESCAN_KEY"

              # ARKIME_WISE_SERVICE_URL is used for the Arkime WISE plugin
              #   if Arkime is performing live capture.
              #   Supply the appropriate WISE service URL (and credentials, if needed), e.g.:
              #   * http://arkime:8081 - for a local cluster
              #   * https://user:password@malcolm/wise - for a remote Malcolm instance
              apply_secret arkime-secret-env \
                --from-literal=MAXMIND_GEOIP_DB_ACCOUNT_ID="${MAXMIND_ACCOUNT_ID:-}" \
                --from-literal=MAXMIND_GEOIP_DB_LICENSE_KEY="${MAXMIND_LICENSE_KEY:-}" \
                --from-literal=MAXMIND_GEOIP_DB_ALTERNATE_DOWNLOAD_URL="${MAXMIND_ALT_URL:-}" \
                --from-literal=ARKIME_PASSWORD_SECRET="$ARKIME_PW" \
                --from-literal=ARKIME_WISE_CONFIG_PIN_CODE="${ARKIME_WISE_PIN:-}" \
                --from-literal=ARKIME_WISE_SERVICE_URL=http://arkime:8081

              echo "Malcolm secret initialization complete."
      volumes:
        - name: tmp
          emptyDir: {}
