---
apiVersion: v1
data:
  NGINX_AUTH_MODE: "{{ .Values.auth.mode }}"
  NGINX_REQUIRE_GROUP: "{{ .Values.auth.require_group | join \",\" }}"
  NGINX_REQUIRE_ROLE: "{{ .Values.auth.require_role | join \",\" }}"
  ROLE_BASED_ACCESS: "{{ .Values.auth.role_based_access }}"
  ROLE_ADMIN: "{{ .Values.auth.role_admin }}"
  ROLE_READ_ACCESS: "{{ .Values.auth.role_read_access }}"
  ROLE_READ_WRITE_ACCESS: "{{ .Values.auth.role_read_write_access }}"
  ROLE_ARKIME_ADMIN: "{{ .Values.auth.role_arkime_admin }}"
  ROLE_ARKIME_READ_ACCESS: "{{ .Values.auth.role_arkime_read_access }}"
  ROLE_ARKIME_READ_WRITE_ACCESS: "{{ .Values.auth.role_arkime_read_write_access }}"
  ROLE_ARKIME_PCAP_ACCESS: "{{ .Values.auth.role_arkime_pcap_access }}"
  ROLE_ARKIME_HUNT_ACCESS: "{{ .Values.auth.role_arkime_hunt_access }}"
  ROLE_ARKIME_WISE_READ_ACCESS: "{{ .Values.auth.role_arkime_wise_read_access }}"
  ROLE_ARKIME_WISE_READ_WRITE_ACCESS: "{{ .Values.auth.role_arkime_wise_read_write_access }}"
  ROLE_DASHBOARDS_READ_ACCESS: "{{ .Values.auth.role_dashboards_read_access }}"
  ROLE_DASHBOARDS_READ_ALL_APPS_ACCESS: "{{ .Values.auth.role_dashboards_read_all_apps_access }}"
  ROLE_DASHBOARDS_READ_WRITE_ACCESS: "{{ .Values.auth.role_dashboards_read_write_access }}"
  ROLE_DASHBOARDS_READ_WRITE_ALL_APPS_ACCESS: "{{ .Values.auth.role_dashboards_read_write_all_apps_access }}"
  ROLE_EXTRACTED_FILES: "{{ .Values.auth.role_extracted_files }}"
  ROLE_NETBOX_READ_ACCESS: "{{ .Values.auth.role_netbox_read_access }}"
  ROLE_NETBOX_READ_WRITE_ACCESS: "{{ .Values.auth.role_netbox_read_write_access }}"
  ROLE_UPLOAD: "{{ .Values.auth.role_upload }}"
  ROLE_CAPTURE_SERVICE: "{{ .Values.auth.role_capture_service }}"
kind: ConfigMap
metadata:
  name: auth-common-env

---
apiVersion: v1
data:
  BEATS_SSL: "{{ .Values.beats_common.ssl }}"
  # host:port for connecting to Logstash instance. When using Malcolm's internal instance
  #   of Logstash this should be logstash:5044
  LOGSTASH_HOST: logstash:5044
kind: ConfigMap
metadata:
  name: beats-common-env

---
apiVersion: v1
data:
  FREQ_LOOKUP: "{{ .Values.lookup_common.freq_lookup }}"
  FREQ_SEVERITY_THRESHOLD: "{{ .Values.lookup_common.freq_severity_threshold }}"
  SENSITIVE_COUNTRY_CODES: "{{ .Values.lookup_common.sensitive_country_codes | join \",\" }}"
  TOTAL_MEGABYTES_SEVERITY_THRESHOLD: "{{ .Values.lookup_common.total_megabytes_severity_threshold }}"
kind: ConfigMap
metadata:
  name: lookup-common-env

---
apiVersion: v1
data:
  FILEBEAT_CLEAN_INACTIVE: {{ .Values.filebeat.filebeat_clean_inactive }}
  FILEBEAT_CLEAN_REMOVED: "{{ .Values.filebeat.filebeat_clean_removed }}"
  FILEBEAT_CLOSE_EOF: "{{ .Values.filebeat.filebeat_close_eof }}"
  FILEBEAT_CLOSE_INACTIVE: {{ .Values.filebeat.filebeat_close_inactive }}
  FILEBEAT_CLOSE_INACTIVE_LIVE: {{ .Values.filebeat.filebeat_close_inactive_live }}
  FILEBEAT_CLOSE_REMOVED: "{{ .Values.filebeat.filebeat_close_removed }}"
  FILEBEAT_CLOSE_RENAMED: "{{ .Values.filebeat.filebeat_close_renamed }}"
  FILEBEAT_IGNORE_OLDER: {{ .Values.filebeat.filebeat_ignore_older }}
  FILEBEAT_SCAN_FREQUENCY: {{ .Values.filebeat.filebeat_scan_frequency }}
  ZIP_CLEANUP_MINUTES: "{{ .Values.filebeat.zip_cleanup_minutes }}"
  LOG_CLEANUP_MINUTES: "{{ .Values.filebeat.log_cleanup_minutes }}"
  FILEBEAT_CLEANUP_VERBOSITY: "{{ .Values.filebeat.filebeat_cleanup_verbosity }}"
  FILEBEAT_TCP_LISTEN: "{{ .Values.filebeat.filebeat_tcp_listen }}"
  FILEBEAT_TCP_LOG_FORMAT: "{{ .Values.filebeat.filebeat_tcp_log_format }}"
  FILEBEAT_TCP_PARSE_DROP_FIELD: "{{ .Values.filebeat.filebeat_tcp_parse_drop_field }}"
  FILEBEAT_TCP_PARSE_SOURCE_FIELD: "{{ .Values.filebeat.filebeat_tcp_parse_source_field }}"
  FILEBEAT_TCP_PARSE_TARGET_FIELD: "{{ .Values.filebeat.filebeat_tcp_parse_target_field }}"
  FILEBEAT_TCP_TAG: "{{ .Values.filebeat.filebeat_tcp_tag }}"
  # Whether or not to use polling vs. native inotify API to watch for files.
  # Also used for to set filebeat filestream's .file_identity and .prospector.scanner.fingerprint, see:
  #  - https://www.elastic.co/blog/introducing-filestream-fingerprint-mode
  #  - https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-filestream#filebeat-input-filestream-file-identity
  #  - https://www.elastic.co/docs/reference/beats/filebeat/filebeat-input-filestream#filebeat-input-filestream-scan-fingerprint
  FILEBEAT_WATCHER_POLLING: "true"
  FILEBEAT_WATCHER_POLLING_ASSUME_CLOSED_SEC: "10"
  FILEBEAT_SCANNER_FINGERPRINT_OFFSET: "{{ .Values.filebeat.filebeat_scanner_fingerprint_offset }}"
  FILEBEAT_SCANNER_FINGERPRINT_LENGTH: "{{ .Values.filebeat.filebeat_scanner_fingerprint_length }}"
  FILEBEAT_PREPARE_PROCESS_COUNT: "{{ .Values.filebeat.filebeat_prepare_process_count }}"
  FILEBEAT_SYSLOG_UDP_LISTEN: "{{ .Values.filebeat.filebeat_syslog_udp_listen }}"
  FILEBEAT_SYSLOG_UDP_PORT: "{{ .Values.filebeat.filebeat_syslog_udp_port }}"
  FILEBEAT_SYSLOG_TCP_LISTEN: "{{ .Values.filebeat.filebeat_syslog_tcp_listen }}"
  FILEBEAT_SYSLOG_TCP_PORT: "{{ .Values.filebeat.filebeat_syslog_tcp_port }}"
kind: ConfigMap
metadata:
  name: filebeat-env

---
apiVersion: v1
data:
  NETBOX_DEFAULT_SITE: "{{ .Values.netbox.netbox_default_site }}"
  NETBOX_DEFAULT_AUTOCREATE_MANUFACTURER: "{{ .Values.netbox.netbox_default_autocreate_manufacturer }}"
  NETBOX_DEFAULT_FUZZY_THRESHOLD: "{{ .Values.netbox.netbox_default_fuzzy_threshold }}"
  NETBOX_MODE: "{{ .Values.netbox.mode }}"
  {{- if eq .Values.netbox.mode "remote" }}
  NETBOX_URL: "{{ .Values.netbox.url }}"
  {{- else }}
  NETBOX_URL: ""
  {{- end }}

  NETBOX_ENRICHMENT: "{{ .Values.netbox.enrichment }}"
  NETBOX_AUTO_POPULATE: "{{ .Values.netbox.netbox_auto_populate }}"
  NETBOX_AUTO_CREATE_PREFIX: "{{ .Values.netbox.netbox_auto_create_prefix }}"
  NETBOX_ENRICHMENT_LOOKUP_SERVICE: "{{ .Values.netbox.netbox_enrichment_lookup_service }}"
  NETBOX_CACHE_SIZE: "{{ .Values.netbox.netbox_cache_size }}"
  NETBOX_CACHE_TTL: "{{ .Values.netbox.netbox_cache_ttl }}"
  NETBOX_AUTO_POPULATE_SUBNETS: "{{ .Values.netbox.netbox_auto_populate_subnets | join \",\" }}"
kind: ConfigMap
metadata:
  name: netbox-common-env

---
apiVersion: v1
data:
  BASE_PATH: netbox
  CENSUS_REPORTING_ENABLED: "false"
  CORS_ORIGIN_ALLOW_ALL: "True"
{{- if .Values.istio.enabled }}
  CSRF_TRUSTED_ORIGINS: https://{{ .Values.istio.virtualservicename }}.{{ .Values.istio.domain }}
{{- else }}
  CSRF_TRUSTED_ORIGINS: {{ .Values.netbox.csrf_trusted_origins | default "http://* https://*" | quote }}
{{- end }}
  EMAIL_FROM: "{{ .Values.netbox.email_from }}"
  EMAIL_PORT: "{{ .Values.netbox.email_port }}"
  EMAIL_SERVER: "{{ .Values.netbox.email_server }}"
  EMAIL_SSL_CERTFILE: "{{ .Values.netbox.email_ssl_certfile }}"
  EMAIL_SSL_KEYFILE: "{{ .Values.netbox.email_ssl_keyfile }}"
  EMAIL_TIMEOUT: "{{ .Values.netbox.email_timeout }}"
  EMAIL_USE_SSL: "{{ .Values.netbox.email_use_ssl }}"
  EMAIL_USE_TLS: "{{ .Values.netbox.email_use_tls }}"
  EXEMPT_VIEW_PERMISSIONS: '*'
  LOGIN_REQUIRED : "True"
  LOGIN_PERSISTENCE : "True"
  ISOLATED_DEPLOYMENT : "True"
  GRAPHQL_ENABLED: "true"
  HOUSEKEEPING_INTERVAL: "86400"
  MAX_PAGE_SIZE: "1000"
  MEDIA_ROOT: /opt/netbox/netbox/media
  METRICS_ENABLED: "false"
  NAPALM_TIMEOUT: "10"
  REDIS_CACHE_INSECURE_SKIP_TLS_VERIFY: "{{ .Values.netbox.redis_cache_insecure_skip_tls_verify }}"
  REDIS_CACHE_SSL: "{{ .Values.netbox.redis_cache_ssl }}"
  REDIS_INSECURE_SKIP_TLS_VERIFY: "{{ .Values.netbox.redis_insecure_skip_tls_verify }}"
  REDIS_SSL: "{{ .Values.netbox.redis_ssl }}"
  RELEASE_CHECK_URL: ""
  # these group names should match role names from auth-common.env
  REMOTE_AUTH_AUTO_CREATE_GROUPS: "False"
  REMOTE_AUTH_AUTO_CREATE_USER: "True"
  REMOTE_AUTH_BACKEND: netbox.authentication.RemoteUserBackend
  REMOTE_AUTH_DEFAULT_GROUPS: "{{ .Values.auth.role_netbox_read_access }}"
  REMOTE_AUTH_DEFAULT_PERMISSIONS: standard_permission
  REMOTE_AUTH_ENABLED: "True"
  REMOTE_AUTH_GROUP_HEADER: "HTTP_X_FORWARDED_ROLES"
  REMOTE_AUTH_GROUP_SEPARATOR: ","
  REMOTE_AUTH_GROUP_SYNC_ENABLED: "True"
  REMOTE_AUTH_HEADER: HTTP_X_FORWARDED_USER
  REMOTE_AUTH_STAFF_GROUPS: "admin"
  REMOTE_AUTH_SUPERUSER_GROUPS: "admin"
  REMOTE_AUTH_USER_EMAIL: "HTTP_X_FORWARDED_EMAIL"
  REMOTE_AUTH_USER_FIRST_NAME: "HTTP_X_FORWARDED_GIVEN_NAME"
  REMOTE_AUTH_USER_LAST_NAME: "HTTP_X_FORWARDED_FAMILY_NAME"
  ENFORCE_GLOBAL_UNIQUE: "false"
  SKIP_STARTUP_SCRIPTS: "true"
  SKIP_SUPERUSER: "false"
  SUPERUSER_EMAIL: admin@example.com
  WEBHOOKS_ENABLED: "{{ .Values.netbox.webhooks_enabled }}"
  GRANIAN_EXTRA_ARGS: "--host=0.0.0.0"
  OPENSSL_FORCE_FIPS_MODE: "0"
kind: ConfigMap
metadata:
  name: netbox-env

---
apiVersion: v1
data:
  NGINX_LOG_ACCESS_AND_ERRORS: "{{ .Values.nginx.log_access_and_errors }}"
  NGINX_SSL: "false"
  # These values are used to handle the Arkime value actions to pivot from Arkime
  #   to Dashboards. The nginx-proxy container's entrypoint will try to formulate
  #   them automatically, but they may be specified explicitly here.
  NGINX_DASHBOARDS_PREFIX: ""
  NGINX_DASHBOARDS_PROXY_PASS: ""
  NGINX_RESOLVER_OVERRIDE: "{{ .Values.nginx.resolver_override }}"
  NGINX_RESOLVER_IPV4: "{{ .Values.nginx.resolver_ipv4 }}"
  NGINX_RESOLVER_IPV6: "{{ .Values.nginx.resolver_ipv6 }}"
  NGINX_X_FORWARDED_PROTO_OVERRIDE: "{{ .Values.nginx.x_forwarded_proto_override }}"
  NGINX_CSP_FORM_ACTION_EXTRA: {{ .Values.nginx.csp_form_action_extra | join " " | quote }}
  NGINX_ERROR_LOG_LEVEL: "{{ .Values.nginx.log_level }}"

  NGINX_LDAP_TLS_STUNNEL: "{{ .Values.nginx.ldap_tls_stunnel }}"
  NGINX_LDAP_TLS_STUNNEL_CHECK_HOST: "{{ .Values.nginx.ldap_tls_stunnel_check_host }}"
  NGINX_LDAP_TLS_STUNNEL_CHECK_IP: "{{ .Values.nginx.ldap_tls_stunnel_check_ip }}"
  NGINX_LDAP_TLS_STUNNEL_VERIFY_LEVEL: "{{ .Values.nginx.ldap_tls_stunnel_verify_level }}"
kind: ConfigMap
metadata:
  name: nginx-env

---
apiVersion: v1
data:
  MAX_LOCKED_MEMORY: "{{ .Values.opensearch.max_locked_memory }}"
  OPENSEARCH_CREDS_CONFIG_FILE: /var/local/curlrc/.opensearch.primary.curlrc
{{- if .Values.is_production }}
  {{- with .Values.arkime_env.production }}
  ARKIME_INIT_SHARDS: "{{ .arkime_init_shards }}"
  ARKIME_INIT_REPLICAS: "{{ .arkime_init_replicas }}"
  ARKIME_INIT_REFRESH_SEC: "{{ .arkime_init_refresh_sec }}"
  ARKIME_INIT_SHARDS_PER_NODE: "{{ .arkime_init_shards_per_node }}"
  {{- end }}
  {{- with .Values.opensearch.production }}
  OPENSEARCH_JAVA_OPTS: -server {{ .java_memory }} -XX:-HeapDumpOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Dlog4j.formatMsgNoLookups=true
  CLUSTER_MAX_SHARDS_PER_NODE: "{{ .cluster_max_shards_per_node }}"
  {{- end }}
{{- else }}
  {{- with .Values.arkime_env.development }}
  ARKIME_INIT_SHARDS: "{{ .arkime_init_shards }}"
  ARKIME_INIT_REPLICAS: "{{ .arkime_init_replicas }}"
  ARKIME_INIT_REFRESH_SEC: "{{ .arkime_init_refresh_sec }}"
  ARKIME_INIT_SHARDS_PER_NODE: "{{ .arkime_init_shards_per_node }}"
  {{- end }}
  {{- with .Values.opensearch.development }}
  OPENSEARCH_JAVA_OPTS: -server {{ .java_memory }} -XX:-HeapDumpOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Dlog4j.formatMsgNoLookups=true
  CLUSTER_MAX_SHARDS_PER_NODE: "{{ .cluster_max_shards_per_node }}"
  {{- end }}
{{- end }}
  OPENSEARCH_PRIMARY: "{{ include "malcolm.opensearchprimary" . }}"
  OPENSEARCH_SECONDARY: "{{ .Values.opensearch.secondary }}"
  OPENSEARCH_SECONDARY_CREDS_CONFIG_FILE: /var/local/curlrc/.opensearch.secondary.curlrc
  OPENSEARCH_SECONDARY_SSL_CERTIFICATE_VERIFICATION: "{{ .Values.opensearch.secondary_ssl_certificate_verification }}"
  OPENSEARCH_SECONDARY_URL: "{{ .Values.opensearch.secondary_url }}"
  OPENSEARCH_SSL_CERTIFICATE_VERIFICATION: "{{ .Values.opensearch.ssl_certificate_verification }}"
  OPENSEARCH_URL: "{{ include "malcolm.opensearchprimaryurl" . }}"
  bootstrap.memory_lock: "true"
  cluster.routing.allocation.disk.threshold_enabled: "false"
  cluster.routing.allocation.node_initial_primaries_recoveries: "8"
{{- if .Values.opensearch.singleNode }}
  discovery.type: single-node
  OPENSEARCH_DEFAULT_REPLICA_COUNT: "0"
{{- else }}
  cluster.initial_cluster_manager_nodes: {{ template "malcolm.managerNodes" . }}
  discovery.type: ""
  OPENSEARCH_DEFAULT_REPLICA_COUNT: "{{ .Values.opensearch.defaultReplicaCount }}"
{{- end }}
  cluster.name: opensearch-cluster
  network.host: 0.0.0.0
  indices.query.bool.max_clause_count: "8192"
  logger.level: INFO
  path.repo: /opt/opensearch/backup
  node.roles: ingest,data,remote_cluster_client,cluster_manager
  discovery.seed_hosts: {{ template "malcolm.discoverySeeds" . }}
  MALCOLM_INDEX_MAX_RESULT_WINDOW: "{{ .Values.siem_env.malcolm_index_max_result_window }}"
  MALCOLM_NETWORK_INDEX_PATTERN: "{{ .Values.siem_env.malcolm_network_index_pattern }}"
  MALCOLM_NETWORK_INDEX_ALIAS: "{{ .Values.siem_env.logstash_override.search_alias }}"
  MALCOLM_NETWORK_INDEX_DEFAULT_PIPELINE: "{{ .Values.siem_env.malcolm_template_default_pipeline }}"
  MALCOLM_NETWORK_INDEX_LIFECYCLE_NAME: "{{ .Values.siem_env.malcolm_template_lifecycle_name }}"
  MALCOLM_NETWORK_INDEX_LIFECYCLE_ROLLOVER_ALIAS: "{{ .Values.siem_env.malcolm_template_lifecycle_rollover_alias }}"
  MALCOLM_NETWORK_INDEX_TIME_FIELD: "{{ .Values.siem_env.malcolm_network_index_time_field }}"
  MALCOLM_NETWORK_INDEX_SUFFIX: "{{ .Values.siem_env.malcolm_network_index_suffix }}"
  MALCOLM_OTHER_INDEX_PATTERN: "{{ .Values.siem_env.malcolm_other_index_pattern }}"
  MALCOLM_OTHER_INDEX_ALIAS: "{{ .Values.siem_env.logstash_override.other_search_alias }}"
  MALCOLM_OTHER_INDEX_DEFAULT_PIPELINE: "{{ .Values.siem_env.malcolm_beats_template_default_pipeline }}"
  MALCOLM_OTHER_INDEX_LIFECYCLE_NAME: "{{ .Values.siem_env.malcolm_beats_template_lifecycle_name }}"
  MALCOLM_OTHER_INDEX_LIFECYCLE_ROLLOVER_ALIAS: "{{ .Values.siem_env.malcolm_beats_template_lifecycle_rollover_alias }}"
  MALCOLM_OTHER_INDEX_TIME_FIELD: "{{ .Values.siem_env.malcolm_other_index_time_field }}"
  MALCOLM_OTHER_INDEX_SUFFIX: "{{ .Values.siem_env.malcolm_other_index_suffix }}"
  ARKIME_NETWORK_INDEX_PATTERN: "{{ .Values.siem_env.arkime_network_index_pattern }}"
  ARKIME_NETWORK_INDEX_TIME_FIELD: "{{ .Values.siem_env.arkime_network_index_time_field }}"
kind: ConfigMap
metadata:
  name: opensearch-env

---
apiVersion: v1
data:
  PCAP_ENABLE_NETSNIFF: "{{ .Values.pcap_capture_env.netsniff }}"
  PCAP_ENABLE_TCPDUMP: "{{ .Values.pcap_capture_env.tcpdump }}"
  PCAP_FILTER: "{{ .Values.pcap_capture_env.pcap_filter }}"
  PCAP_IFACE: "{{ .Values.pcap_capture_env.pcap_iface | join \",\" }}"
  PCAP_IFACE_TWEAK: "{{ .Values.pcap_capture_env.pcap_iface_tweak }}"
  PCAP_ROTATE_MEGABYTES: "{{ .Values.pcap_capture_env.pcap_rotate_megabytes }}"
  PCAP_ROTATE_MINUTES: "{{ .Values.pcap_capture_env.pcap_rotate_minutes }}"
  PCAP_ROTATE_SECONDS: "{{ mul .Values.pcap_capture_env.pcap_rotate_minutes 60 }}"
  PCAP_IFACE_STATS_CRON_EXPRESSION: "{{ .Values.pcap_capture_env.pcap_iface_stats_cron_expression }}"
kind: ConfigMap
metadata:
  name: pcap-capture-env

---
apiVersion: v1
data:
  # for handling configmap/secrets files/directories
  CONFIG_MAP_DIR: configmap;secretmap
  # profile, for running all Malcolm containers ("malcolm") vs. capture-only containers ("hedgehog")
  MALCOLM_PROFILE: malcolm
  PGID: "{{ .Values.process_env.pgid }}"
  PUID: "{{ .Values.process_env.puid }}"
  TINI_VERBOSITY: "{{ .Values.process_env.tini_verbosity }}"
kind: ConfigMap
metadata:
  name: process-env

---
apiVersion: v1
data:
  # When possible, docker containers will automatically add trusted CA certificate files
  #   found in the ./nginx/ca-trust directory (which is bind mounted to /ca-trust).
  PUSER_CA_TRUST: /var/local/ca-trust
kind: ConfigMap
metadata:
  name: ssl-env

---
apiVersion: v1
data:
  SURICATA_CUSTOM_RULES_ONLY: "{{ .Values.suricata_env.custom_rules_only }}"
  SURICATA_UPDATE_DEBUG: "{{ .Values.suricata_env.update_debug }}"
  SURICATA_DISABLE_ICS_ALL: "{{ .Values.suricata_env.disable_ics_all }}"
  SURICATA_UPDATE_SOURCES: "{{ .Values.suricata_env.update_sources }}"
  SURICATA_UPDATE_RULES: "{{ .Values.suricata_env.update_rules }}"
  SURICATA_UPDATE_ENABLE_SOURCES: "{{ .Values.suricata_env.update_enable_sources | join \",\" }}"
  SURICATA_UPDATE_CRON_EXPRESSION: "{{ .Values.suricata_env.update_cron_expression }}"
  SURICATA_DISABLE_SIDS: "{{ .Values.suricata_env.disable_sids | join \",\" }}"
  SURICATA_HOME_NET: "'[{{ .Values.pcap_capture_env.home_net | join \",\" }}]'"
  LUA_PATH: "{{ .Values.suricata_env.lua_path }}"
  PCAP_PROCESSED_DIRECTORY: "/data/pcap/processed"
{{- if .Values.is_production }}
  {{- with .Values.suricata_env.production }}
  SURICATA_STREAM_MEMCAP: "{{ .stream_memcap }}"
  SURICATA_HOST_MEMCAP: "{{ .host_memcap }}"
  SURICATA_DEFRAG_MEMCAP: "{{ .defrag_memcap }}"
  SURICATA_FTP_MEMCAP: "{{ .ftp_memcap }}"
  SURICATA_STREAM_REASSEMBLY_MEMCAP: "{{ .stream_reassembly_memcap }}"
  SURICATA_FLOW_MEMCAP: "{{ .flow_memcap }}"
  {{- end }}
{{- else }}
  {{- with .Values.suricata_env.development }}
  SURICATA_STREAM_MEMCAP: "{{ .stream_memcap }}"
  SURICATA_HOST_MEMCAP: "{{ .host_memcap }}"
  SURICATA_DEFRAG_MEMCAP: "{{ .defrag_memcap }}"
  SURICATA_FTP_MEMCAP: "{{ .ftp_memcap }}"
  SURICATA_STREAM_REASSEMBLY_MEMCAP: "{{ .stream_reassembly_memcap }}"
  SURICATA_FLOW_MEMCAP: "{{ .flow_memcap }}"
  {{- end }}
{{- end }}
kind: ConfigMap
metadata:
  name: suricata-env

---
apiVersion: v1
data:
  AUTO_TAG: "{{ .Values.upload_common_env.auto_tag }}"
  PCAP_MONITOR_HOST: pcap-monitor
  PCAP_PIPELINE_IGNORE_PREEXISTING: "{{ .Values.upload_common_env.pcap_pipeline_ignore_preexisting }}"
  PCAP_PIPELINE_POLLING: "true"
  PCAP_PIPELINE_POLLING_ASSUME_CLOSED_SEC: "10"
  PCAP_PIPELINE_VERBOSITY: "{{ .Values.upload_common_env.pcap_pipeline_verbosity }}"
  PCAP_UPLOAD_MAX_FILE_GB: "{{ .Values.upload_common_env.pcap_upload_max_file_gb }}"
  EXTRA_TAGS: "{{ .Values.upload_common_env.extra_tags | join \",\" }}"
  WATCHER_UPLOAD: "true"
  WATCHER_PUBLISH: "true"
  SAFE_EXTRACT_MAX_ENTRIES: "{{ .Values.upload_common_env.safe_extract_max_entries }}"
  SAFE_EXTRACT_MAX_DEPTH: "{{ .Values.upload_common_env.safe_extract_max_depth }}"
  SAFE_EXTRACT_MAX_BYTES: "{{ .Values.upload_common_env.safe_extract_max_bytes }}"
kind: ConfigMap
metadata:
  name: upload-common-env

{{- if eq ( .Values.ca_trust_configmap_name | default "var-local-catrust" ) "var-local-catrust" }}
---
apiVersion: v1
data:
  .gitignore: |+
    *
    !.gitignore
kind: ConfigMap
metadata:
  name: var-local-catrust
{{- end }}

---
apiVersion: v1
data:
  {{- if .Values.is_production }}
    {{- with .Values.zeek_env.production }}
  EXTRACTED_FILE_MAX_BYTES: "{{ .extracted_file_max_bytes }}"
    {{- end }}
  {{- else }}
    {{- with .Values.zeek_env.development }}
  EXTRACTED_FILE_MAX_BYTES: "{{ .extracted_file_max_bytes }}"
    {{- end }}
  {{- end }}
  ZEEK_FILE_ANALYZER_TIMEOUT_SEC: "{{ .Values.zeek_env.zeek_file_analyzer_timeout_sec }}"
  ZEEK_JA4SSH_PACKET_COUNT: "{{ .Values.zeek_env.zeek_ja4ssh_packet_count }}"
  ZEEK_LONG_CONN_REPEAT_LAST_DURATION: "{{ .Values.zeek_env.zeek_long_conn_repeat_last_duration }}"
  ZEEK_LONG_CONN_DO_NOTICE: "{{ .Values.zeek_env.zeek_long_conn_do_notice }}"
  ZEEK_LONG_CONN_DURATIONS: "{{ .Values.zeek_env.zeek_long_conn_durations }}"
  ZEEK_METRICS_PORT: "{{ .Values.zeek_env.zeek_metrics_port }}"
